<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>ログイン - 艦これ ドロップ検索 管理</title>
<link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>
<body class="login-body">
<form class="login-box" method="post" autocomplete="on">
  <h1>艦これ ドロップ検索<span>管理画面</span></h1>
  {% if not configured %}<p class="msg err">.env の設定が未完了です (GITHUB_TOKEN / パスワード)。</p>{% endif %}
  {% if error %}<p class="msg err">{{ error }}</p>{% endif %}
  <label>ユーザー名<input name="user" autocomplete="username" required autofocus></label>
  <label>パスワード<input name="password" type="password" autocomplete="current-password" required></label>
  <button class="btn primary" type="submit">ログイン</button>
</form>
</body>
</html>
