name: 艦ろぐの取得

# 艦ろぐ (https://kanlog.info/) は奇数時 (日本時間) に更新される。運営者の方から
# 「2 時間に 1 回程度・更新が終わった時間帯 (11:10 など)」の取得の許可をいただいているので、
# 奇数時の 10 分過ぎ (= UTC の偶数時 10 分) に取りに行く。
# 取ったページは kanlog ブランチ (履歴を残さない) に置き、データ更新 (update.yml) が読み取る。
on:
  schedule:
    - cron: "10 0-22/2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "サイトが更新されていなくても、海域のページを取りに行く"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write             # 新しいページを取ったら、データ更新 (update.yml) を起動する

concurrency:
  group: kanlog
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 前回の取得結果 (kanlog ブランチ) を読み込む
        run: |
          if git ls-remote --exit-code --heads origin kanlog >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch kanlog \
              "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" kanlog
            rm -rf kanlog/.git
          else
            mkdir -p kanlog
          fi

      - name: 艦ろぐのページを取得
        id: fetch
        run: python scripts/fetch_kanlog.py --out kanlog ${{ inputs.force && '--force' || '' }}

      - name: kanlog ブランチに保存 (履歴は残さない)
        run: |
          cd kanlog
          git init --quiet -b kanlog
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "艦ろぐ $(TZ=Asia/Tokyo date '+%Y/%m/%d %H:%M')"
          git push --quiet --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" kanlog

      # 新しいページを取ったら、すぐにデータ更新を起動する (ダンプは取り直さず、艦ろぐの数だけ入れ替える)。
      # 管理画面の設定「艦ろぐを取ったら再集計する」(kanlog_auto_update) を切ると起動しない
      - name: データ更新を起動
        if: steps.fetch.outputs.fetched == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AUTO=$(python -c "import json;c=json.load(open('admin_config.json',encoding='utf-8'));print('0' if c.get('kanlog_auto_update') is False or (c.get('kanlog_rates') is False and c.get('kanlog_limited') is False) else '1')" 2>/dev/null || echo 1)
          if [ "$AUTO" = "1" ]; then
            gh workflow run update.yml --repo "${{ github.repository }}" --ref main -f source=kanlog
          else
            echo "管理画面の設定で、艦ろぐの取得後の再集計は切られています"
          fi
