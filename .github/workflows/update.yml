name: データ更新

on:
  schedule:
    # poi のダンプは毎日 01:00 ごろ (日本時間) に作られるので、01:37 と 02:37 に取りに行く。
    # 予備として 05:07〜09:07 にも毎時 1 回。GitHub の定時実行は遅れたり飛ばされたりするため。
    # ダンプが前回と同じなら数秒で終わる
    - cron: "37 16,17 * * *"
    - cron: "7 20-23 * * *"
    - cron: "7 0 * * *"
  workflow_dispatch:         # 手動実行 / 管理画面の「再集計」ボタン
  push:                      # 管理画面で設定を保存したら自動で再集計
    branches: [main]
    paths:
      - admin_config.json
      - Normal_Drop_Ship.json
      - scripts/update.py          # 集計のプログラムを直したときも、すぐ作り直す
      - scripts/parse_limited_page.py
      - data/limited_extra.json
      - data/limited_src/current.html   # 管理画面から限定ページの HTML を送ったとき
      - data/limited_src/archive.html

permissions:
  contents: write
  actions: write             # 過去月の取り込みが残っていれば、自分を続けて起動するため

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      # 保存の直後に複数回起動された場合でも、常に最新の main で集計する
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 月ごとの集計結果 (state ブランチ) を取得
        run: |
          if git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch state \
              "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" state
            rm -rf state/.git
          else
            mkdir -p state
          fi
          ls -la state

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet -r scripts/requirements.txt

      # 艦これ攻略Wiki「期間限定ドロップイベント」を取得して data/limited_page.json を作り直す。
      # 定時実行では 1 日 1 回だけ取りに行く。取れなくても保存済みのページで続ける
      - name: 限定ページ (Wiki) を取得
        continue-on-error: true
        run: python scripts/fetch_limited_page.py ${{ github.event_name == 'workflow_dispatch' && '--force' || (github.event_name == 'push' && '--no-fetch' || '') }}

      - name: ダンプを取得して集計
        id: agg
        run: python scripts/update.py --state-dir state ${{ github.event_name == 'push' && '--smart' || '' }}

      - name: 結果を main にコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git add Drop_Data.json Build_Data.json Update.json data/
            if git diff --cached --quiet; then
              echo "変更なし"
              exit 0
            fi
            git commit --quiet -m "データ自動更新 $(TZ=Asia/Tokyo date '+%Y/%m/%d %H:%M')"
            if git push --quiet; then
              exit 0
            fi
            # 集計中に管理画面で保存されるなどして main が進んでいた場合:
            # 生成ファイル同士をマージせず、最新の main に合わせて集計し直す (ダンプは取り直さない)
            echo "main が更新されていたため、最新の設定で集計し直します ($i 回目)"
            mkdir -p /tmp/limsrc && cp data/limited_src/current.html data/limited_src/status.json /tmp/limsrc/ 2>/dev/null || true
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            cp /tmp/limsrc/* data/limited_src/ 2>/dev/null || true   # この実行で Wiki から取ったページは残す
            python scripts/fetch_limited_page.py --no-fetch || true
            python scripts/update.py --state-dir state --no-download
            sleep $((i * 3))
          done
          echo "::error::main へのコミットに失敗しました"
          exit 1

      - name: 集計結果を state ブランチに保存 (履歴は残さない)
        run: |
          cd state
          git init --quiet -b state
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "state $(TZ=Asia/Tokyo date '+%Y/%m/%d %H:%M')" || exit 0
          git push --quiet --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" state

      # 過去月アーカイブの取り込みが残っていれば、すぐに次の実行を起動する (全部そろうまで自動で続く)
      - name: 残りの過去月を続けて取り込む
        if: steps.agg.outputs.pending == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update.yml --repo "${{ github.repository }}" --ref main
